<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>A Little Birthday Surprise</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pacifico&display=swap');

		:root {
			--ink: #392b45;
			--plum: #6d4169;
			--rose: #e98291;
			--peach: #ffbf91;
			--cream: #fff8ee;
			--paper: #fffdf9;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			overflow-x: hidden;
			color: var(--ink);
			font-family: 'DM Sans', sans-serif;
			background: #f9d3b8;
			background-image:
				radial-gradient(circle at 12% 18%, rgba(255,255,255,.62) 0 4px, transparent 5px),
				radial-gradient(circle at 88% 72%, rgba(255,255,255,.5) 0 5px, transparent 6px),
				linear-gradient(135deg, #f9d3b8 0%, #f6b5b0 48%, #c98bb1 100%);
		}

		body::before, body::after {
			position: fixed;
			z-index: -1;
			font-size: clamp(3rem, 10vw, 8rem);
			opacity: .18;
			pointer-events: none;
		}

		body::before { content: '✦'; top: 8vh; left: 8vw; transform: rotate(-18deg); }
		body::after { content: '♡'; right: 8vw; bottom: 8vh; transform: rotate(16deg); }

		.page {
			position: relative;
			z-index: 1;
			width: min(100% - 32px, 980px);
			min-height: 100vh;
			margin: auto;
			padding: 52px 0 64px;
			display: grid;
			place-items: center;
		}

		.balloons {
			position: fixed;
			inset: 0;
			z-index: 0;
			pointer-events: none;
			overflow: hidden;
		}
		.balloon {
			position: absolute;
			width: clamp(42px, 7vw, 74px);
			aspect-ratio: .78;
			border-radius: 50% 50% 45% 45%;
			background: var(--balloon-color);
			box-shadow: inset -9px -10px 0 rgba(91, 48, 76, .1), inset 10px 10px 0 rgba(255,255,255,.18);
			transform: rotate(var(--balloon-rotation));
		}
		.balloon::before {
			content: '';
			position: absolute;
			left: 50%;
			bottom: -7px;
			width: 12px;
			height: 12px;
			background: var(--balloon-color);
			clip-path: polygon(0 0, 100% 0, 50% 100%);
			transform: translateX(-50%);
		}
		.balloon::after {
			content: '';
			position: absolute;
			left: 50%;
			top: 100%;
			width: 1px;
			height: clamp(90px, 18vh, 180px);
			background: rgba(91, 48, 76, .32);
			transform: translateX(-50%) rotate(3deg);
			transform-origin: top;
		}
		.balloon:nth-child(1) { top: 11%; left: 5%; --balloon-color: #f28a9b; --balloon-rotation: -10deg; --balloon-delay: -1s; }
		.balloon:nth-child(2) { top: 24%; right: 5%; --balloon-color: #79c7c5; --balloon-rotation: 12deg; --balloon-delay: -3s; }
		.balloon:nth-child(3) { top: 62%; left: 3%; --balloon-color: #f7d154; --balloon-rotation: -14deg; --balloon-delay: -2s; }
		.balloon:nth-child(4) { top: 70%; right: 4%; --balloon-color: #9b78c9; --balloon-rotation: 10deg; --balloon-delay: -4s; }
		.balloon:nth-child(5) { top: 4%; left: 48%; width: clamp(34px, 5vw, 58px); --balloon-color: #ffad76; --balloon-rotation: 4deg; --balloon-delay: -2.5s; }

		.intro { text-align: center; margin-bottom: 26px; }
		.eyebrow {
			margin: 0 0 10px;
			color: #7c4c6c;
			font-size: .76rem;
			font-weight: 700;
			letter-spacing: .2em;
			text-transform: uppercase;
		}
		h1 {
			margin: 0;
			color: #4d3153;
			font-family: Pacifico, cursive;
			font-size: clamp(2.5rem, 8vw, 5.4rem);
			font-weight: 400;
			line-height: 1.1;
		}
		.hint { margin: 30px 0 0; font-size: .98rem; opacity: .72; }

		.surprise {
			width: min(100%, 760px);
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.envelope-wrap {
			position: relative;
			isolation: isolate;
			width: min(78vw, 430px);
			height: min(55vw, 285px);
			margin: 32px 0 20px;
			perspective: 1000px;
		}

		.envelope {
			position: absolute;
			z-index: 2;
			inset: 0;
			border: 0;
			padding: 0;
			cursor: pointer;
			background: transparent;
			filter: drop-shadow(0 22px 18px rgba(91, 48, 76, .22));
		}

		.envelope:focus-visible { outline: 4px solid #fff; outline-offset: 8px; border-radius: 8px; }
		.envelope-base {
			position: absolute;
			z-index: 2;
			inset: 0;
			overflow: hidden;
			border-radius: 8px;
			background: linear-gradient(145deg, #ed8e9b, #d96d82);
		}
		.envelope-base::before, .envelope-base::after {
			content: '';
			position: absolute;
			bottom: -1px;
			width: 72%;
			height: 100%;
			background: #e9798d;
		}
		.envelope-base::before { left: -2px; clip-path: polygon(0 0, 100% 100%, 0 100%); }
		.envelope-base::after { right: -2px; clip-path: polygon(100% 0, 100% 100%, 0 100%); background: #d96f83; }

		.letter {
			position: absolute;
			z-index: 1;
			left: 8%;
			bottom: 8%;
			width: 84%;
			height: 84%;
			padding: 24px 18px;
			border-radius: 4px;
			background: var(--paper);
			box-shadow: 0 4px 10px rgba(75, 41, 61, .12);
			transition: transform .9s cubic-bezier(.2,.85,.3,1), z-index 0s .45s;
		}
		.letter-content { text-align: center; font-family: Pacifico, cursive; font-size: clamp(1.2rem, 3.6vw, 1.8rem); color: var(--plum); }
		.letter-content small { display: block; margin-top: 8px; font: 500 .62rem 'DM Sans', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #ba7280; }

		.flap {
			position: absolute;
			z-index: 3;
			top: 0;
			left: 0;
			width: 100%;
			height: 62%;
			transform-origin: top;
			clip-path: polygon(0 0, 100% 0, 50% 100%);
			background: linear-gradient(145deg, #f39ca5, #e27b8e);
			transition: transform .8s cubic-bezier(.2,.85,.3,1), z-index 0s .4s;
		}
		.seal { position: absolute; z-index: 4; top: 45%; left: 50%; width: 54px; height: 54px; display: grid; place-items: center; transform: translate(-50%, -50%); border-radius: 50%; color: #fff8ee; background: #b95370; box-shadow: 0 3px 7px rgba(98, 35, 62, .22); font-size: 1.5rem; transition: opacity .3s; }

		.open .flap { z-index: 0; transform: rotateX(180deg); }
		.open .letter { z-index: 4; transform: translateY(-45%); transition-delay: .15s; }
		.open .seal { opacity: 0; }
		.open .envelope { cursor: default; }
		.open .envelope { cursor: default; animation: envelope-open 1.1s cubic-bezier(.2,.85,.3,1) both; }

		@keyframes envelope-open {
			0% { transform: translateY(0) rotate(0); }
			45% { transform: translateY(-22px) rotate(-2deg); }
			75% { transform: translateY(5px) rotate(1deg); }
			100% { transform: translateY(0) rotate(0); }
		}

		.confetti {
			position: absolute;
			inset: 18% 8%;
			z-index: 10;
			pointer-events: none;
			overflow: visible;
		}
		.confetti-piece {
			position: absolute;
			left: 50%;
			top: 48%;
			width: 11px;
			height: 20px;
			border-radius: 2px;
			background: var(--confetti-color);
			opacity: 0;
			transform: translate(-50%, -50%);
		}
		.confetti-piece:nth-child(3n) { width: 7px; height: 7px; border-radius: 50%; }
		.confetti-piece:nth-child(4n) { width: 6px; height: 14px; }

		@keyframes confetti-burst {
			0% { opacity: 0; transform: translate(-50%, -50%) rotate(0deg) scale(.4); }
			12% { opacity: 1; }
			100% { opacity: 0; transform: translate(calc(-50% + var(--confetti-x)), calc(-50% + var(--confetti-y))) rotate(var(--confetti-rotation)) scale(1.15); }
		}

		.video-stage {
			width: min(100%, 700px);
			max-height: 0;
			overflow: hidden;
			opacity: 0;
			transform: translateY(20px);
			transition: max-height .9s ease, opacity .6s ease, transform .7s ease;
		}
		.open + .video-stage { max-height: 520px; opacity: 1; transform: translateY(0); }
		video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border: 7px solid rgba(255,253,249,.8); border-radius: 14px; background: #5c3655; box-shadow: 0 18px 36px rgba(79, 41, 69, .2); }
		.video-caption { margin: 15px 0 0; text-align: center; font-family: Pacifico, cursive; font-size: 1.35rem; color: #5b395c; }
		.replay { display: block; margin: 14px auto 0; padding: 9px 16px; border: 1px solid rgba(91,57,92,.35); border-radius: 99px; color: #5b395c; background: rgba(255,255,255,.35); font: 700 .74rem 'DM Sans', sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
		.replay:hover { background: rgba(255,255,255,.7); }

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<div class="balloons" aria-hidden="true">
		<span class="balloon"></span>
		<span class="balloon"></span>
		<span class="balloon"></span>
		<span class="balloon"></span>
		<span class="balloon"></span>
	</div>
	<main class="page">
		<section class="surprise" aria-labelledby="title">
			<header class="intro">
				<p class="eyebrow">A tiny surprise, sealed with care</p>
				<h1 id="title">Happy Birthday, Grace!</h1>
				<p class="hint">Click the envelope to open your surprise</p>
			</header>

			<div class="envelope-wrap">
				<div class="confetti" aria-hidden="true">
					<span class="confetti-piece" style="--confetti-color:#f7d154;--confetti-x:-190px;--confetti-y:-120px;--confetti-rotation:-210deg;--confetti-delay:0ms"></span>
					<span class="confetti-piece" style="--confetti-color:#f28a9b;--confetti-x:-145px;--confetti-y:-155px;--confetti-rotation:160deg;--confetti-delay:40ms"></span>
					<span class="confetti-piece" style="--confetti-color:#79c7c5;--confetti-x:-95px;--confetti-y:-145px;--confetti-rotation:250deg;--confetti-delay:80ms"></span>
					<span class="confetti-piece" style="--confetti-color:#9b78c9;--confetti-x:-45px;--confetti-y:-175px;--confetti-rotation:-120deg;--confetti-delay:120ms"></span>
					<span class="confetti-piece" style="--confetti-color:#f7d154;--confetti-x:10px;--confetti-y:-160px;--confetti-rotation:190deg;--confetti-delay:160ms"></span>
					<span class="confetti-piece" style="--confetti-color:#f28a9b;--confetti-x:65px;--confetti-y:-178px;--confetti-rotation:-180deg;--confetti-delay:60ms"></span>
					<span class="confetti-piece" style="--confetti-color:#79c7c5;--confetti-x:120px;--confetti-y:-140px;--confetti-rotation:220deg;--confetti-delay:100ms"></span>
					<span class="confetti-piece" style="--confetti-color:#9b78c9;--confetti-x:175px;--confetti-y:-115px;--confetti-rotation:-240deg;--confetti-delay:140ms"></span>
					<span class="confetti-piece" style="--confetti-color:#f7d154;--confetti-x:-215px;--confetti-y:-45px;--confetti-rotation:130deg;--confetti-delay:180ms"></span>
					<span class="confetti-piece" style="--confetti-color:#f28a9b;--confetti-x:210px;--confetti-y:-55px;--confetti-rotation:-160deg;--confetti-delay:220ms"></span>
					<span class="confetti-piece" style="--confetti-color:#79c7c5;--confetti-x:-230px;--confetti-y:35px;--confetti-rotation:260deg;--confetti-delay:260ms"></span>
					<span class="confetti-piece" style="--confetti-color:#9b78c9;--confetti-x:225px;--confetti-y:25px;--confetti-rotation:-220deg;--confetti-delay:300ms"></span>
					<span class="confetti-piece" style="--confetti-color:#f7d154;--confetti-x:-180px;--confetti-y:105px;--confetti-rotation:180deg;--confetti-delay:340ms"></span>
					<span class="confetti-piece" style="--confetti-color:#f28a9b;--confetti-x:-120px;--confetti-y:125px;--confetti-rotation:-140deg;--confetti-delay:380ms"></span>
					<span class="confetti-piece" style="--confetti-color:#79c7c5;--confetti-x:130px;--confetti-y:115px;--confetti-rotation:230deg;--confetti-delay:420ms"></span>
					<span class="confetti-piece" style="--confetti-color:#9b78c9;--confetti-x:185px;--confetti-y:90px;--confetti-rotation:-190deg;--confetti-delay:460ms"></span>
				</div>
				<button class="envelope" type="button" aria-label="Open your birthday surprise">
					<span class="envelope-base"></span>
					<span class="letter"><span class="letter-content">For you, birthday girl! <small>I hope you like the gift, kahit alam mo na kung ano yung laman HAHAHAHA 🎉🎁🎈</small></span></span>
					<span class="flap"></span>
					<span class="seal" aria-hidden="true">♥</span>
				</button>
			</div>

			<div class="video-stage" aria-live="polite">
				<video id="birthdayVideo" controls playsinline preload="metadata" poster="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=1200&q=80">
					<source src="video/vid1.mp4" type="video/mp4" />
					Your browser does not support the video element.
				</video>
				<p class="video-caption">Make a wish. This day is all yours.</p>
				<button class="replay" type="button">Replay the surprise</button>
			</div>
		</section>
	</main>

	<script>
		const envelope = document.querySelector('.envelope');
		const envelopeWrap = document.querySelector('.envelope-wrap');
		const video = document.querySelector('#birthdayVideo');
		const replay = document.querySelector('.replay');
		const hint = document.querySelector('.hint');
		const confettiPieces = document.querySelectorAll('.confetti-piece');

		function burstConfetti() {
			confettiPieces.forEach((piece) => {
				piece.getAnimations().forEach((animation) => animation.cancel());
				piece.animate([
					{ opacity: 0, transform: 'translate(-50%, -50%) rotate(0deg) scale(.4)' },
					{ opacity: 1, offset: .12 },
					{
						opacity: 0,
						transform: `translate(calc(-50% + ${piece.style.getPropertyValue('--confetti-x')}), calc(-50% + ${piece.style.getPropertyValue('--confetti-y')})) rotate(${piece.style.getPropertyValue('--confetti-rotation')}) scale(1.15)`
					}
				], {
					duration: 2400,
					delay: parseInt(piece.style.getPropertyValue('--confetti-delay'), 10),
					easing: 'cubic-bezier(.16,.75,.3,1)',
					fill: 'forwards'
				});
			});
		}

		function openSurprise() {
			if (envelopeWrap.classList.contains('open')) return;
			envelopeWrap.classList.add('open');
			burstConfetti();
			video.play().catch(() => {});
		}

		envelope.addEventListener('click', openSurprise);
		replay.addEventListener('click', () => {
			envelopeWrap.classList.remove('open');
			video.pause();
			video.currentTime = 0;
			hint.textContent = 'Click the envelope to open your surprise';
		});
	</script>
</body>
</html>
